<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2f7bff">
<title>StreamHub – Watch. Play. Explore.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<aside>
  <div class="logo"><span class="mark">&#9654;</span>Stream<span>Hub</span></div>
  <nav id="tabs">
    <button class="on" data-t="apps"><i>🏠</i><span>Home</span></button>
    <button data-t="tv"><i>📺</i><span>Live TV</span></button>
    <button data-t="games"><i>🎮</i><span>Games</span></button>
    <button data-t="youtube"><i>▶️</i><span>YouTube</span></button>
    <button data-t="twitch"><i>🟣</i><span>Twitch</span></button>
  </nav>
  <div class="side-foot">100% free<br>No sign-up</div>
</aside>
<div class="content">

<main>
  <section id="apps" class="tab on">
    <div class="hero"><div><small id="date"></small><h1 id="greet">Welcome</h1><p>Pick an app or jump into live TV.</p></div><div id="clock">--:--</div></div>
    <h2>Apps</h2>
    <!-- tiles are filled in by app.js from the APPS list -->
    <div class="grid" id="appGrid"></div>
  </section>

  <section id="tv" class="tab">
    <h2>Live TV (IPTV)</h2>
    <div class="bar">
      <select id="list">
        <option value="https://iptv-org.github.io/iptv/categories/news.m3u">News</option>
        <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">Sports</option>
        <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">Movies</option>
        <option value="https://iptv-org.github.io/iptv/categories/music.m3u">Music</option>
        <option value="https://iptv-org.github.io/iptv/categories/kids.m3u">Kids</option>
        <option value="https://iptv-org.github.io/iptv/countries/us.m3u">USA</option>
      </select>
      <input id="custom" placeholder="Or paste your own .m3u playlist URL">
      <button id="load">Load</button>
      <input id="search" placeholder="Search channels">
    </div>
    <div id="status"></div>
    <div class="channels" id="channels"></div>
  </section>

  <section id="games" class="tab">
    <h2>Games</h2>
    <!-- tiles are filled in by app.js from the GAMES list -->
    <div class="grid" id="gameGrid"></div>
  </section>

  <section id="youtube" class="tab">
    <h2>YouTube</h2>
    <div class="bar">
      <input id="yq" placeholder="Search YouTube or paste a link">
      <button id="ysearch">Search</button>
      <button id="ykey" title="Set API key">Key</button>
    </div>
    <!-- category buttons (Trending, Music, Gaming, News, Sports, Movies, Live, Shorts) are filled in by app.js -->
    <div class="chips" id="chips"></div>
    <div id="ystatus"></div>
    <div class="grid vids" id="vids"></div>
  </section>

  <section id="twitch" class="tab">
    <h2>Twitch</h2>
    <div class="bar">
      <input id="tw" placeholder="Twitch channel name">
      <button id="twgo">Watch</button>
    </div>
  </section>
</main>

</div></div>
<div id="ov" hidden>
  <div class="ovbar"><button id="back">&#8592; Back</button><span id="ovtitle"></span></div>
  <div class="ovbody" id="ovbody"></div>
</div>

<footer>StreamHub is an independent launcher. It does not host or own third-party content.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
